<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        Login - RoomChat
    </title>


    <link rel="stylesheet" href="/static/css/style.css">

</head>



<body>


<div class="auth-container">


    <div class="auth-card">


        <h1>
            Join RoomChat
        </h1>


        <p>
            Create your identity before entering rooms
        </p>




        <form id="loginForm">



            <label>
                Username
            </label>


            <input

                type="text"

                id="username"

                placeholder="Enter username"

                required

            >





            <label>
                Display Name
            </label>


            <input

                type="text"

                id="displayName"

                placeholder="Your name"

            >





            <label>
                Profile Picture URL
            </label>


            <input

                type="text"

                id="profilePicture"

                placeholder="Image URL (optional)"

            >





            <button

                type="submit"

                class="primary-btn"

            >

                Continue

            </button>



        </form>



        <p class="back-link">

            <a href="/">
                Back to Home
            </a>

        </p>



    </div>


</div>





<script src="/static/js/main.js"></script>


<script src="/static/js/user.js"></script>



</body>

</html>
